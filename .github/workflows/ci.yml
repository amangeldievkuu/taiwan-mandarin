name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taiwan
          POSTGRES_PASSWORD: taiwan
          POSTGRES_DB: taiwan_mandarin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taiwan -d taiwan_mandarin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://taiwan:taiwan@localhost:5432/taiwan_mandarin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22
          cache: npm
      # The word lists, CC-CEDICT and Tatoeba (~30 MB); refreshed weekly.
      - name: Cache content sources
        uses: actions/cache@v6
        with:
          path: data/raw
          key: content-sources-${{ hashFiles('packages/content/src/fetch.ts') }}-${{ github.run_id }}
          restore-keys: content-sources-${{ hashFiles('packages/content/src/fetch.ts') }}-
      - run: npm ci
      - run: npm run build:shared
      - name: Build content
        run: npm run content
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: API tests
        run: npm run test -w @taiwan-mandarin/api
      - name: Build
        run: npm run build -w @taiwan-mandarin/api -w @taiwan-mandarin/web

  smoke:
    # Only main: pull requests aren't releases, and forks of this public repo get no secrets.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    # A Smoke outage shouldn't turn main red; the failed job still shows in the run.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Upload dependency inventory to Smoke
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          SMOKE_ASSET_ID: ${{ vars.SMOKE_ASSET_ID }}
        run: |
          curl -sS --fail-with-body --retry 3 \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            -H "Idempotency-Key: $GITHUB_SHA-$GITHUB_RUN_ATTEMPT" \
            -F "files=@package-lock.json" -F "paths=package-lock.json" \
            -F "release=${GITHUB_SHA::12}" -F "commit=$GITHUB_SHA" \
            -F "pipelineUrl=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://api.smoke.aircraft.tw/v1/assets/$SMOKE_ASSET_ID/inventory"
