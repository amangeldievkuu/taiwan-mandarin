server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  # API on the same origin, so the refresh cookie stays first-party (Safari ITP).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed build assets, and content/dictionary files versioned by ?v=: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~ ^/(content|dict)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /content/manifest.json {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: every other path is the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
