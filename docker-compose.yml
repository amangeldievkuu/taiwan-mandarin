services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taiwan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taiwan}
      POSTGRES_DB: ${POSTGRES_DB:-taiwan_mandarin}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # The app itself (docker compose --profile app up -d --build). The API refuses to start
  # without JWT_SECRET in .env; OPENAI_API_KEY (AI and pronunciation) is optional.
  api:
    profiles: [app]
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taiwan}:${POSTGRES_PASSWORD:-taiwan}@db:5432/${POSTGRES_DB:-taiwan_mandarin}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Empty means the API's default (apps/api/src/config/env.ts, .env.example).
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_EXPLAIN_MODEL: ${OPENAI_EXPLAIN_MODEL:-}
      OPENAI_EXPLAIN_EFFORT: ${OPENAI_EXPLAIN_EFFORT:-}
      OPENAI_TALK_MODEL: ${OPENAI_TALK_MODEL:-}
      OPENAI_TALK_EFFORT: ${OPENAI_TALK_EFFORT:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      OPENAI_SERVICE_TIER: ${OPENAI_SERVICE_TIER:-}
      OPENAI_VERBOSITY: ${OPENAI_VERBOSITY:-}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      SPEECH_DAILY_LIMIT: ${SPEECH_DAILY_LIMIT:-}

  web:
    profiles: [app]
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
